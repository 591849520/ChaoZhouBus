# ═════════════════════════════════════════════════════════════════════
# ChaoZhouBus (高校潮州同乡会大巴智能系统) 生产级 Nginx 代理配置
# 
# 特性：
# 1. 强制 HTTP 301 自动跳转 HTTPS
# 2. 支持 Let's Encrypt / Certbot 自动化证书续签路径
# 3. 反向代理到 Fastify Node.js (默认 127.0.0.1:3000)
# 4. 真实客户端 IP 穿透 (X-Real-IP, X-Forwarded-For, X-Forwarded-Proto)
# 5. API 频次保护与防爆破 (选座抢票限流 20r/s，突发 40r/s)
# 6. Gzip 压缩传输优化 (JSON, JS, CSS, 字体等)
# ═════════════════════════════════════════════════════════════════════

# 定义限流区域：基于客户端二进制 IP，分配 10MB 内存池，基础限制 20 次/秒
limit_req_zone $binary_remote_addr zone=chaozhou_api_limit:10m rate=20r/s;

# Upstream 上游 Node.js 服务
upstream chaozhou_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP 80 端口服务：自动跳转至 HTTPS，保留 ACME 证书校验通道
server {
    listen 80;
    listen [::]:80;
    server_name bus.yourdomain.com; # 替换为您的实际业务域名

    # Certbot 自动化 SSL 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 其余所有 HTTP 请求永久重定向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 443 端口服务：业务主反代与安全加固
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bus.yourdomain.com; # 替换为您的实际业务域名

    # SSL 证书与密钥文件路径 (Let's Encrypt 标准路径或自定义证书路径)
    ssl_certificate /etc/letsencrypt/live/bus.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bus.yourdomain.com/privkey.pem;

    # SSL 安全增强协议与加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 客户端请求体大小限制 (如名册批量操作、图片上传)
    client_max_body_size 20M;

    # Gzip 压缩加速
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 根代理或常规静态页面 (若有)
    location / {
        proxy_pass http://chaozhou_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康探活路由：允许监控系统与云负载均衡高频访问，不触发限流，不计入 access_log
    location /health {
        proxy_pass http://chaozhou_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # API 接口路由：启用防超刷限流，允许突发 40 个请求
    location /api/ {
        limit_req zone=chaozhou_api_limit burst=40 nodelay;

        proxy_pass http://chaozhou_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
